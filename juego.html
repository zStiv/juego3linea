
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego 3 en Linea</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-4">

        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <h1 class="text-center">Juego 3 en Linea</h1>

                <form>
                    <div class="d-flex align-items-center mb-3">
                        <img src="img/perroIngeniero.jpg" width="40" height="40" class="me-2" alt="Perro Ingeiero">
                        <input type="text" id="1name" name="1name" class="form-control">
                    </div>

                    <div class="d-flex align-items-center mb-3">
                        <img src="img/perroMafioso.png" width="40" height="40" class="me-2" alt="Perro Mafioso">
                        <input type="text" id="2name" name="2name" class="form-control">
                    </div>
                </form>

                <button class="btn btn-success w-100" onclick="iniciar()">INICIAR</button>

                <p class="text-center mt-3" id="turno">Turno: nombre</p>

                <div class="mx-auto mt-4" style="max-width: 300px;">
                    <div class="row row-cols-3 g-0 border">

                        <div class="col border">
                            <img id="perro1" src="img/perro.jpg" class="img-fluid" onclick="jugar(1)">
                        </div>
                        <div class="col border">
                            <img id="perro2" src="img/perro.jpg" class="img-fluid" onclick="jugar(2)">
                        </div>
                        <div class="col border">
                            <img id="perro3" src="img/perro.jpg" class="img-fluid" onclick="jugar(3)">
                        </div>

                        <div class="col border">
                            <img id="perro4" src="img/perro.jpg" class="img-fluid" onclick="jugar(4)">
                        </div>
                        <div class="col border">
                            <img id="perro5" src="img/perro.jpg" class="img-fluid" onclick="jugar(5)">
                        </div>
                        <div class="col border">
                            <img id="perro6" src="img/perro.jpg" class="img-fluid" onclick="jugar(6)">
                        </div>

                        <div class="col border">
                            <img id="perro7" src="img/perro.jpg" class="img-fluid" onclick="jugar(7)">
                        </div>
                        <div class="col border">
                            <img id="perro8" src="img/perro.jpg" class="img-fluid" onclick="jugar(8)">
                        </div>
                        <div class="col border">
                            <img id="perro9" src="img/perro.jpg" class="img-fluid" onclick="jugar(9)">
                        </div>

                    </div>
                </div>

            </div>
        </div>

    </div>

<script>
    var jugador = 1;
    var nombre1 = "";
    var nombre2 = "";
    var iniciado = false;
    var tablero = ["", "", "", "", "", "", "", "", ""];

    function iniciar() {
        nombre1 = document.getElementById("1name").value;
        nombre2 = document.getElementById("2name").value;

        if (nombre1 == "" || nombre2 == "") {
            alert("Ingrese los nombres de los jugadores");
            return;
        }

        jugador = 1;
        iniciado = true;
        tablero = ["", "", "", "", "", "", "", "", ""];

        for (var i = 1; i <= 9; i++) {
            document.getElementById("perro" + i).src = "img/perro.jpg";
        }

        document.getElementById("turno").innerText = "Turno: " + nombre1;
    }

    function jugar(numero) {
        if (iniciado == false) {
            return;
        }

        if (tablero[numero - 1] != "") {
            return;
        }

        var imagen = document.getElementById("perro" + numero);

        if (jugador == 1) {
            imagen.src = "img/perroIngeniero.jpg";
            tablero[numero - 1] = "X";
        } else {
            imagen.src = "img/perroMafioso.png";
            tablero[numero - 1] = "O";
        }

        // Verificar si el jugador ganó
        if (verificarGanador()) {
            if (jugador == 1) {
                document.getElementById("turno").innerText = "Ganador: " + nombre1;
            } else {
                document.getElementById("turno").innerText = "Ganador: " + nombre2;
            }

            iniciado = false;
            return;
        }

        if (jugador == 1) {
            jugador = 2;
            document.getElementById("turno").innerText = "Turno: " + nombre2;
        } else {
            jugador = 1;
            document.getElementById("turno").innerText = "Turno: " + nombre1;
        }
    }

    function verificarGanador() {
        var combinaciones = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        for (var i = 0; i < combinaciones.length; i++) {
            var a = combinaciones[i][0];
            var b = combinaciones[i][1];
            var c = combinaciones[i][2];

            if (tablero[a] != "" &&
                tablero[a] == tablero[b] &&
                tablero[b] == tablero[c]) {
                return true;
            }
        }

        return false;
    }
</script>

</body>
</html>
